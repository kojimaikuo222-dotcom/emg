name: Build Android APK

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/project-overview-analysis-3mnvk2

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install npm dependencies
        run: npm install

      - name: Build web bundle
        run: npm run build:web

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: emg-collector-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Also push the built APK to its own branch. The Actions artifact API
      # serves files from Azure Blob Storage, which isn't reachable from
      # wherever this repo's CI-triggering sandbox runs; a plain git branch is.
      - name: Publish APK to apk-output branch
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/emg-collector-debug.apk
          git checkout --orphan apk-output
          git rm -rf . > /dev/null
          cp /tmp/emg-collector-debug.apk ./emg-collector-debug.apk
          git add -f emg-collector-debug.apk
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit -m "Built debug APK from ${GITHUB_SHA}"
          git push origin HEAD:apk-output --force
