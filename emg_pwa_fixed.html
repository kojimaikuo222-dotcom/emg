<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0e12">
<title>EMG 采集</title>
<style>
:root {
  --bg: #0d0e12;
  --surf: #13151c;
  --surf2: #1c1e28;
  --border: #252836;
  --acc: #00e5a0;
  --acc2: #4dabf7;
  --rec: #ff3366;
  --text: #e8eaf0;
  --text2: #8b92a8;
  --ch0:#00e5a0;--ch1:#4dabf7;--ch2:#c084fc;
  --ch3:#fbbf24;--ch4:#fb7185;--ch5:#34d399;
  --ch6:#f0abfc;--ch7:#7dd3fc;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;font-size:14px;overflow:hidden}
body{display:flex;flex-direction:column}

/* Header */
header{
  background:var(--surf);border-bottom:1px solid var(--border);
  padding:10px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0;
}
.logo{font-family:monospace;font-size:13px;font-weight:700;color:var(--acc);letter-spacing:.05em}
.logo span{color:var(--text2)}
.pill{
  display:flex;align-items:center;gap:5px;
  padding:4px 10px;border-radius:20px;border:1px solid var(--border);
  background:var(--surf2);font-family:monospace;font-size:11px;color:var(--text2);
}
.dot{width:7px;height:7px;border-radius:50%;background:var(--text2);flex-shrink:0;transition:background .3s}
.dot.on{background:var(--acc);box-shadow:0 0 6px var(--acc)}
.dot.rec{background:var(--rec);animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.rec-pill{display:none;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;
  border:1px solid var(--rec);background:#2a0d1a;color:var(--rec);
  font-family:monospace;font-size:11px;font-weight:700;letter-spacing:.08em}
.rec-pill.show{display:flex}
.cnt{margin-left:auto;font-family:monospace;font-size:11px;color:var(--text2)}
.cnt b{color:var(--acc)}

/* Tabs */
.tabs{display:flex;background:var(--surf);border-bottom:1px solid var(--border);flex-shrink:0}
.tab{
  flex:1;padding:10px 0;text-align:center;font-size:13px;font-weight:600;
  color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;
}
.tab.active{color:var(--acc);border-bottom-color:var(--acc)}

/* Pages */
.page{display:none;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.page.active{display:flex;flex-direction:column}

/* Connect page */
.connect-wrap{padding:16px}
.section-title{font-size:11px;font-weight:600;color:var(--text2);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:10px 18px;border-radius:8px;border:none;cursor:pointer;
  font-size:14px;font-weight:600;font-family:inherit;transition:all .15s;
  -webkit-appearance:none;
}
.btn-primary{background:var(--acc);color:#000}
.btn-primary:active{background:#00c48a}
.btn-outline{background:transparent;color:var(--text2);border:1px solid var(--border)}
.btn-outline:active{border-color:var(--acc);color:var(--acc)}
.btn-danger{background:var(--rec);color:#fff}
.btn-block{width:100%;display:flex}
.btn:disabled{opacity:.4;cursor:not-allowed}
.ble-hint{
  background:var(--surf2);border:1px solid var(--border);border-radius:10px;
  padding:14px;margin-bottom:14px;
}
.ble-hint p{font-size:13px;color:var(--text2);line-height:1.6}
.ble-hint b{color:var(--text)}
.scan-status{font-size:12px;color:var(--text2);margin:8px 0;min-height:16px}
.device-item{
  background:var(--surf2);border:1px solid var(--border);border-radius:8px;
  padding:12px;margin-bottom:8px;cursor:pointer;transition:border-color .15s;
}
.device-item:active{border-color:var(--acc)}
.device-item.selected{border-color:var(--acc);background:rgba(0,229,160,.06)}
.dname{font-family:monospace;font-size:13px;color:var(--text);margin-bottom:2px}
.daddr{font-family:monospace;font-size:10px;color:var(--text2)}
.drssi{float:right;font-family:monospace;font-size:11px;color:var(--text2)}
.btn-row{display:flex;gap:8px;margin-top:10px}
.conn-info{
  background:var(--surf2);border:1px solid var(--acc);border-radius:10px;
  padding:14px;margin-bottom:14px;display:none;
}
.conn-info.show{display:block}
.conn-info-name{font-family:monospace;font-size:14px;color:var(--acc);margin-bottom:4px}
.conn-info-addr{font-family:monospace;font-size:11px;color:var(--text2)}

/* Record page */
.record-wrap{padding:16px;display:flex;flex-direction:column;gap:14px}
.label-section{}
.chip-wrap{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
.chip{
  padding:6px 13px;border-radius:20px;border:1px solid var(--border);
  font-size:13px;color:var(--text2);cursor:pointer;background:var(--surf2);
  transition:all .15s;white-space:nowrap;
}
.chip:active,.chip.active{border-color:var(--acc);color:var(--acc);background:rgba(0,229,160,.08);font-weight:600}
.note-input{
  width:100%;padding:10px 12px;border-radius:8px;
  border:1px solid var(--border);background:var(--surf2);
  color:var(--text);font-size:14px;font-family:inherit;outline:none;
  margin-top:6px;-webkit-appearance:none;
}
.note-input:focus{border-color:var(--acc2)}
.rec-bar{
  position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--border);
  padding:12px 16px;
}
.rec-status{font-size:12px;color:var(--text2);text-align:center;margin-top:8px}
.rec-status.ready{color:var(--acc)}

/* Wave page */
.wave-wrap{padding:10px;display:flex;flex-direction:column;gap:10px;flex:1}
#wave-canvas{
  width:100%;height:220px;display:block;
  border-radius:8px;background:var(--surf2);border:1px solid var(--border);flex-shrink:0;
}
.ch-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ch-card{
  background:var(--surf2);border:1px solid var(--border);border-radius:8px;
  padding:8px 10px;display:flex;align-items:center;gap:8px;
}
.ch-color{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.ch-label{font-family:monospace;font-size:11px;color:var(--text2)}
.ch-val{font-family:monospace;font-size:15px;font-weight:700;margin-left:auto}
.gesture-box{
  background:var(--surf2);border:1px solid var(--border);border-radius:8px;
  padding:10px 14px;text-align:center;
}
.gesture-label{font-size:11px;color:var(--text2);margin-bottom:4px}
.gesture-val{font-size:18px;color:var(--acc2);font-weight:600}

/* Files page */
.files-wrap{padding:14px}
.file-item{
  display:flex;align-items:center;gap:8px;
  padding:10px 0;border-bottom:1px solid var(--border);
}
.file-item:last-child{border-bottom:none}
.file-name{font-family:monospace;font-size:11px;color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-meta{font-size:11px;color:var(--text2);flex-shrink:0}
.file-dl{
  flex-shrink:0;padding:5px 10px;border-radius:6px;
  border:1px solid var(--border);color:var(--acc2);font-size:11px;cursor:pointer;
  background:transparent;font-family:inherit;
}
.empty{text-align:center;color:var(--text2);font-size:13px;padding:32px 0}

/* Spinner */
.spin{display:inline-block;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<header>
  <div class="logo">EMG<span>/</span>采集</div>
  <div class="pill"><div class="dot" id="dot"></div><span id="conn-txt">未连接</span></div>
  <div class="rec-pill" id="rec-pill">● REC</div>
  <div class="cnt">采样 <b id="cnt">0</b></div>
</header>

<div class="tabs">
  <div class="tab active" onclick="showTab('connect',this)">连接</div>
  <div class="tab" onclick="showTab('record',this)">标注录制</div>
  <div class="tab" onclick="showTab('wave',this)">波形</div>
  <div class="tab" onclick="showTab('files',this)">文件</div>
</div>

<!-- ── CONNECT ── -->
<div class="page active" id="tab-connect">
<div class="connect-wrap">

  <div class="ble-hint">
    <p><b>使用须知</b><br>
    需要 Android Chrome（版本 56+），请确认已开启手机蓝牙。<br>
    gForcePro+ 开机后绿灯每2秒闪一次即可扫描连接。</p>
  </div>

  <div class="conn-info" id="conn-info">
    <div class="conn-info-name" id="conn-name">—</div>
    <div class="conn-info-addr" id="conn-addr">—</div>
  </div>

  <div class="section-title">设备</div>
  <div class="scan-status" id="scan-status">点击下方按钮扫描</div>
  <div id="device-list"></div>

  <div class="btn-row">
    <button class="btn btn-primary" id="btn-scan" onclick="scanDevice()" style="flex:1">扫描 gForce 设备</button>
    <button class="btn btn-danger" id="btn-disc" onclick="doDisconnect()" style="display:none">断开</button>
  </div>

  <div style="margin-top:14px">
    <div class="section-title" style="margin-bottom:6px">调试日志 <small style="font-weight:400;text-transform:none;color:var(--text2)">（连接问题时展开看）</small></div>
    <div id="dbg-log" style="
      background:var(--surf2);border:1px solid var(--border);border-radius:8px;
      padding:10px;font-family:monospace;font-size:10px;color:var(--text2);
      max-height:140px;overflow-y:auto;line-height:1.7;
    ">等待操作…</div>
    <div style="display:flex;gap:8px;margin-top:6px">
      <button class="btn btn-outline" style="flex:1;font-size:12px;padding:7px" onclick="dbgLog('--- 清空 ---',true)">清空日志</button>
      <button class="btn btn-outline" style="flex:1;font-size:12px;padding:7px" onclick="listServices()">列出 Services</button>
    </div>
  </div>

</div>
</div>

<!-- ── RECORD ── -->
<div class="page" id="tab-record">
<div class="record-wrap">

  <div class="label-section">
    <div class="section-title">场景</div>
    <div class="chip-wrap" id="scene-chips">
      <div class="chip" onclick="pickScene('民宿清扫',this)">🏨 民宿清扫</div>
      <div class="chip" onclick="pickScene('家庭烹饪',this)">🍳 家庭烹饪</div>
      <div class="chip" onclick="pickScene('家庭清洁',this)">🧹 家庭清洁</div>
      <div class="chip" onclick="pickScene('洗涤整理',this)">🧺 洗涤整理</div>
    </div>
  </div>

  <div class="label-section">
    <div class="section-title">工序</div>
    <div class="chip-wrap" id="task-chips"><div style="font-size:12px;color:var(--text2)">请先选择场景</div></div>
  </div>

  <div class="label-section">
    <div class="section-title">工具</div>
    <div class="chip-wrap" id="tool-chips"><div style="font-size:12px;color:var(--text2)">请先选择场景</div></div>
  </div>

  <div class="label-section">
    <div class="section-title">备注（可选）</div>
    <input class="note-input" id="note" type="text" placeholder="如：左手、疲劳状态…">
  </div>

</div>
<div class="rec-bar">
  <button class="btn btn-primary btn-block" id="btn-rec" onclick="toggleRec()">▶ 开始录制</button>
  <div class="rec-status" id="rec-status">请先选择场景、工序和工具</div>
</div>
</div>

<!-- ── WAVE ── -->
<div class="page" id="tab-wave">
<div class="wave-wrap">
  <canvas id="wave-canvas"></canvas>
  <div class="gesture-box">
    <div class="gesture-label">识别手势</div>
    <div class="gesture-val" id="gest-val">—</div>
  </div>
  <div class="ch-grid" id="ch-grid"></div>
</div>
</div>

<!-- ── FILES ── -->
<div class="page" id="tab-files">
<div class="files-wrap">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <div class="section-title" style="margin:0">已保存 CSV</div>
    <button class="btn btn-outline" style="padding:6px 12px;font-size:12px" onclick="renderFiles()">刷新</button>
  </div>
  <div id="files-list"><div class="empty">暂无文件</div></div>
</div>
</div>

<script>
// ─── Scene Config ────────────────────────────────────────────────────────────
const SCENES = {
  '民宿清扫': {
    tasks: ['换布草','整理床铺','吸尘','拖地','清洁卫生间','擦拭家具','垃圾处理'],
    tools: ['吸尘器','湿巾拖把','干拖把','床单被套','枕套','抹布','清洁剂喷瓶'],
  },
  '家庭烹饪': {
    tasks: ['炒菜翻炒','备菜切割','洗菜','搅拌调味','装盘','开关灶具'],
    tools: ['炒锅铲','菜刀','汤勺','筷子','案板','锅把'],
  },
  '家庭清洁': {
    tasks: ['洗碗','擦灶台','清洁水槽','拖地','擦窗'],
    tools: ['洗碗刷','海绵','抹布','拖把','清洁手套'],
  },
  '洗涤整理': {
    tasks: ['手洗衣物','晾晒','叠衣','拧干'],
    tools: ['衣物','衣架','洗衣盆'],
  },
};

const GESTURE_LABELS = {0:'未知',1:'握拳',2:'手展开',3:'波浪内',4:'波浪外',5:'掐指',6:'射击',255:'放松'};
const CH_COLORS = ['--ch0','--ch1','--ch2','--ch3','--ch4','--ch5','--ch6','--ch7'];

// ─── State ───────────────────────────────────────────────────────────────────
let gDevice = null, gServer = null, gChar = null;
let isConnected = false, isRecording = false;
let selScene = null, selTask = null, selTool = null;
let samples = 0;
let recRows = [];  // {ts, task, tool, note, ch0..7}
let savedFiles = [];

const CH = 8, WAVE_LEN = 200;
let waveBuf = Array.from({length:CH},()=>new Array(WAVE_LEN).fill(128));
let lastEmg = new Array(CH).fill(0);

// ─── Debug Log ───────────────────────────────────────────────────────────────
function dbgLog(msg, clear=false) {
  const el = document.getElementById('dbg-log');
  const time = new Date().toTimeString().slice(0,8);
  if (clear) { el.textContent = msg; return; }
  el.textContent += '\n[' + time + '] ' + msg;
  el.scrollTop = el.scrollHeight;
  console.log('[DBG]', msg);
}

async function listServices() {
  if (!gServer || !gServer.connected) { dbgLog('❌ 未连接，无法列出 Services'); return; }
  try {
    dbgLog('列出所有 Primary Services…');
    const svcs = await gServer.getPrimaryServices();
    svcs.forEach(s => dbgLog('  SVC: ' + s.uuid));
    if (svcs.length === 0) dbgLog('  (空)');
  } catch(e) { dbgLog('listServices 失败: ' + e.message); }
}

// ─── BLE UUIDs ───────────────────────────────────────────────────────────────
// gForcePro+ service UUIDs (confirmed from OYMotion SDK source)
const SVC   = '0000ffd0-0000-1000-8000-00805f9b34fb';
const DATA  = '0000ffd4-0000-1000-8000-00805f9b34fb';
const CMD   = '0000ffd1-0000-1000-8000-00805f9b34fb';

// CMD_ENABLE: header=0xAA, len=0x02, cmd=SetMotionDataConfig
// bit flags: 0x88 = EMG(0x08) | Gesture(0x80) both enabled, 200Hz
// Full packet per SDK: [0xAA, 0x02, 0x00, 0x88, 0x00]
const CMD_ENABLE = new Uint8Array([0xAA, 0x02, 0x00, 0x88, 0x00]);

const NTF_EMG = 0x05, NTF_GEST = 0x03; // corrected type bytes from SDK

// ─── Tabs ────────────────────────────────────────────────────────────────────
function showTab(name, el) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  el.classList.add('active');
  if (name==='files') renderFiles();
  if (name==='wave') resizeCanvas();
}

// ─── BLE Connect ─────────────────────────────────────────────────────────────
async function scanDevice() {
  if (!navigator.bluetooth) {
    alert('此浏览器不支持 Web Bluetooth。\n请使用 Android Chrome，并在 chrome://flags 中开启 "Experimental Web Platform features"。');
    return;
  }
  setStatus('正在打开蓝牙选择器...', false);
  try {
    // acceptAllDevices + optionalServices 是最兼容的方式
    // filters+optionalServices 组合在某些 Android 版本下会漏掉设备
    gDevice = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: [SVC, '0000ffd0-0000-1000-8000-00805f9b34fb'],
    });
    gDevice.addEventListener('gattserverdisconnected', onDisconnect);
    setStatus('设备已选择，正在连接 GATT…', false);
    await doConnect();
  } catch(e) {
    if (e.name === 'NotFoundError' || e.name === 'AbortError') {
      setStatus('已取消选择', false);
    } else {
      setStatus('扫描失败: ' + e.message, false);
      console.error('BLE scan error', e);
    }
  }
}

async function doConnect() {
  try {
    setStatus('连接 GATT Server…', false);
    gServer = await gDevice.gatt.connect();

    setStatus('获取 Service (ffd0)…', false);
    let svc;
    try {
      svc = await gServer.getPrimaryService(SVC);
    } catch(e) {
      throw new Error('找不到 Service ffd0：' + e.message + '\n请确认手环已开机（绿灯闪烁），且不在充电状态。');
    }

    setStatus('获取数据 Characteristic (ffd4)…', false);
    try {
      gChar = await svc.getCharacteristic(DATA);
    } catch(e) {
      throw new Error('找不到 Characteristic ffd4：' + e.message);
    }

    setStatus('启动通知…', false);
    await gChar.startNotifications();
    gChar.addEventListener('characteristicvaluechanged', onNotify);

    // 发送启用 EMG 数据的指令
    setStatus('发送 EMG 启用指令…', false);
    try {
      const cmdChar = await svc.getCharacteristic(CMD);
      await cmdChar.writeValue(CMD_ENABLE);
      console.log('CMD_ENABLE sent OK');
    } catch(e) {
      // CMD 写入失败不阻断连接，但要提示
      console.warn('CMD write failed (non-fatal):', e);
      setStatus('⚠️ 指令写入失败，EMG 数据可能不推送（' + e.message + '）', false);
    }

    isConnected = true;
    updateConnUI();
    updateRecStatus();

  } catch(e) {
    console.error('doConnect failed:', e);
    isConnected = false;
    if (gDevice?.gatt?.connected) gDevice.gatt.disconnect();
    setStatus('❌ 连接失败：' + e.message, false);
    updateConnUI();
  }
}

async function doDisconnect() {
  if (isRecording) stopRec();
  if (gDevice && gDevice.gatt.connected) gDevice.gatt.disconnect();
}

function onDisconnect() {
  isConnected = false;
  if (isRecording) stopRec();
  updateConnUI();
}

function updateConnUI() {
  const dot = document.getElementById('dot');
  const txt = document.getElementById('conn-txt');
  const disc = document.getElementById('btn-disc');
  const info = document.getElementById('conn-info');
  if (isConnected) {
    dot.className = 'dot on';
    txt.textContent = gDevice?.name || '已连接';
    disc.style.display = '';
    document.getElementById('btn-scan').textContent = '重新扫描';
    document.getElementById('conn-name').textContent = gDevice?.name || '设备';
    document.getElementById('conn-addr').textContent = gDevice?.id || '';
    info.classList.add('show');
    setStatus('已连接，可开始录制', false);
  } else {
    dot.className = 'dot';
    txt.textContent = '未连接';
    disc.style.display = 'none';
    document.getElementById('btn-scan').textContent = '扫描 gForce 设备';
    info.classList.remove('show');
    setStatus('设备已断开', false);
  }
}

function setStatus(msg, scanning) {
  document.getElementById('scan-status').textContent = msg;
  dbgLog(msg);
  const btn = document.getElementById('btn-scan');
  btn.disabled = scanning;
  btn.innerHTML = scanning ? '<span class="spin">⟳</span> 扫描中...' : btn.textContent;
}

// ─── BLE Notifications ───────────────────────────────────────────────────────
function onNotify(event) {
  const data = new Uint8Array(event.target.value.buffer);
  if (data.length < 2) return;

  const type = data[0];
  console.debug('notify type=0x' + type.toString(16), 'len='+data.length);

  // gForcePro+ EMG raw data: type=0x05, 8 bytes follow (uint8 per channel)
  // Some firmware versions use 0x08 — handle both
  if ((type === 0x05 || type === 0x08) && data.length >= 9) {
    const ch = Array.from(data.slice(1, 9));
    lastEmg = ch;
    for (let i=0;i<CH;i++) { waveBuf[i].push(ch[i]); waveBuf[i].shift(); }

    if (isRecording) {
      const ts = Date.now();
      recRows.push({ts, task:selTask, tool:selTool, note:document.getElementById('note').value, ch});
      samples++;
      document.getElementById('cnt').textContent = samples.toLocaleString();
    }
    updateChCards();

  // Gesture notification: type=0x03 or 0x07
  } else if ((type === 0x03 || type === 0x07) && data.length >= 3) {
    const gid = data[1], prob = data[2];
    document.getElementById('gest-val').textContent = (GESTURE_LABELS[gid]||'手势'+gid) + ' ' + prob + '%';

  // 未知包：打印到 console 帮助调试
  } else {
    console.log('unknown notify: type=0x'+type.toString(16)+' data=['+Array.from(data).map(b=>b.toString(16).padStart(2,'0')).join(' ')+']');
  }
}

// ─── Label Selection ──────────────────────────────────────────────────────────
function pickScene(scene, el) {
  selScene = scene; selTask = null; selTool = null;
  document.querySelectorAll('#scene-chips .chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  const cfg = SCENES[scene];
  document.getElementById('task-chips').innerHTML = cfg.tasks.map(t=>
    `<div class="chip" onclick="pickChip('task','${t}',this)">${t}</div>`).join('');
  document.getElementById('tool-chips').innerHTML = cfg.tools.map(t=>
    `<div class="chip" onclick="pickChip('tool','${t}',this)">${t}</div>`).join('');
  updateRecStatus();
}

function pickChip(type, val, el) {
  const grp = el.parentElement;
  grp.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  if (type==='task') selTask = val;
  else selTool = val;
  updateRecStatus();
}

function updateRecStatus() {
  const s = document.getElementById('rec-status');
  if (!isConnected) { s.textContent='请先连接设备'; s.className='rec-status'; return; }
  if (!selScene) { s.textContent='请选择场景'; s.className='rec-status'; return; }
  if (!selTask)  { s.textContent='请选择工序'; s.className='rec-status'; return; }
  if (!selTool)  { s.textContent='请选择工具'; s.className='rec-status'; return; }
  s.textContent = `✓ 准备录制：${selTask} · ${selTool}`;
  s.className = 'rec-status ready';
}

// ─── Recording ───────────────────────────────────────────────────────────────
function toggleRec() {
  if (isRecording) { stopRec(); return; }
  if (!isConnected) { alert('请先连接设备'); return; }
  if (!selTask || !selTool) { alert('请选择工序和工具'); return; }
  startRec();
}

function startRec() {
  recRows = []; samples = 0;
  isRecording = true;
  document.getElementById('cnt').textContent = '0';
  const btn = document.getElementById('btn-rec');
  btn.textContent = '⏹ 停止录制';
  btn.style.background = 'var(--rec)';
  document.getElementById('rec-pill').classList.add('show');
  document.getElementById('dot').className = 'dot rec';
}

function stopRec() {
  isRecording = false;
  const btn = document.getElementById('btn-rec');
  btn.textContent = '▶ 开始录制';
  btn.style.background = '';
  document.getElementById('rec-pill').classList.remove('show');
  document.getElementById('dot').className = 'dot' + (isConnected?' on':'');
  if (recRows.length > 0) saveCSV();
}

function saveCSV() {
  const now = new Date();
  const ts = now.toISOString().replace(/[:.]/g,'-').slice(0,19);
  const safe = s => s.replace(/[^a-zA-Z0-9\u4e00-\u9fff]/g,'_');
  const fname = `emg_${ts}_${safe(selTask)}_${safe(selTool)}.csv`;

  const header = 'timestamp,time_str,task,tool,note,ch0,ch1,ch2,ch3,ch4,ch5,ch6,ch7\n';
  const rows = recRows.map(r => {
    const d = new Date(r.ts);
    const tstr = d.toTimeString().slice(0,8)+'.'+String(d.getMilliseconds()).padStart(3,'0');
    return [r.ts/1000, tstr, r.task, r.tool, r.note||'', ...r.ch].join(',');
  }).join('\n');

  const blob = new Blob([header+rows], {type:'text/csv'});
  const url = URL.createObjectURL(blob);

  savedFiles.unshift({name:fname, url, count:recRows.length, size:Math.round(blob.size/1024*10)/10});
  renderFiles();

  // auto-download
  const a = document.createElement('a');
  a.href = url; a.download = fname; a.click();
}

// ─── Files ───────────────────────────────────────────────────────────────────
function renderFiles() {
  const el = document.getElementById('files-list');
  if (!savedFiles.length) { el.innerHTML='<div class="empty">暂无文件<br><small>录制停止后自动保存</small></div>'; return; }
  el.innerHTML = savedFiles.map((f,i) => `
    <div class="file-item">
      <div class="file-name" title="${f.name}">${f.name}</div>
      <div class="file-meta">${f.count}样本·${f.size}KB</div>
      <a class="file-dl" href="${f.url}" download="${f.name}">下载</a>
    </div>`).join('');
}

// ─── Waveform ─────────────────────────────────────────────────────────────────
const canvas = document.getElementById('wave-canvas');
const ctx = canvas.getContext('2d');

function buildChCards() {
  const grid = document.getElementById('ch-grid');
  grid.innerHTML = Array.from({length:CH},(_,i)=>`
    <div class="ch-card">
      <div class="ch-color" style="background:var(${CH_COLORS[i]})"></div>
      <div class="ch-label">CH${i}</div>
      <div class="ch-val" id="cv${i}" style="color:var(${CH_COLORS[i]})">—</div>
    </div>`).join('');
}

function updateChCards() {
  for(let i=0;i<CH;i++) {
    const el = document.getElementById('cv'+i);
    if(el) el.textContent = lastEmg[i];
  }
}

function resizeCanvas() {
  canvas.width = canvas.offsetWidth * window.devicePixelRatio;
  canvas.height = canvas.offsetHeight * window.devicePixelRatio;
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
}

const CH_HEX = ['#00e5a0','#4dabf7','#c084fc','#fbbf24','#fb7185','#34d399','#f0abfc','#7dd3fc'];

function drawWave() {
  const W = canvas.offsetWidth, H = canvas.offsetHeight;
  if (!W || !H) { requestAnimationFrame(drawWave); return; }
  ctx.clearRect(0,0,W,H);

  // grid lines
  ctx.strokeStyle = 'rgba(255,255,255,.04)';
  ctx.lineWidth = .5;
  for(let i=1;i<CH;i++){
    const y = (i/CH)*H;
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
  }

  const slotH = H/CH, step = W/WAVE_LEN;
  for(let ch=0;ch<CH;ch++){
    const buf = waveBuf[ch];
    const midY = (ch+.5)*slotH, amp = slotH*.42;
    ctx.strokeStyle = CH_HEX[ch];
    ctx.lineWidth = 1.5;
    ctx.shadowColor = isRecording ? CH_HEX[ch] : 'transparent';
    ctx.shadowBlur = isRecording ? 2 : 0;
    ctx.beginPath();
    for(let i=0;i<WAVE_LEN;i++){
      const x = i*step, v = ((buf[i]-128)/128)*amp, y = midY-v;
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.stroke();
    ctx.shadowBlur=0;

    // ch label
    ctx.fillStyle=CH_HEX[ch];
    ctx.font=`10px monospace`;
    ctx.fillText('CH'+ch, 3, ch*slotH+12);
  }
  requestAnimationFrame(drawWave);
}

// ─── Init ────────────────────────────────────────────────────────────────────
buildChCards();
resizeCanvas();
drawWave();
window.addEventListener('resize', resizeCanvas);
updateRecStatus();
</script>
